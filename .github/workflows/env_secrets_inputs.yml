name: Demo CI Env Secrets

on:
    # push
    workflow_dispatch

env: 
    Global_APP_ENV: global-dev
jobs:
    build:
        runs-on: ubuntu-latest

        env: 
            Job_APP_ENV: job-dev

        steps:
            - name: Say Hello
              run: echo "Hello from second workflow!"

            - name: Install
              env: 
                APP_ENV: dev
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: echo "Environment $APP_ENV using $DB_PASSWORD, $GLOBAL_APP_ENV, $Job_APP_ENV"

            - name: Create demo file
              run: |
                echo "This is a demo file from CI pipeline." > demo.txt
                echo "File created successfully."
                
            - name: Upload Demo 
              uses: actions/upload-artifact@v4
              with:
                  name: demo-artifact-demo
                  path: .